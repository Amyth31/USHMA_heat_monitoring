version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ushma
      POSTGRES_USER: ushma
      POSTGRES_PASSWORD: ushma_dev_password
    ports:
      - "5432:5432"
    volumes:
      - ushma_db_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ushma"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      FLASK_DEBUG: "false"
      # Connects as ushma_app (created by scripts/init_db.sql), NOT the
      # superuser/owner role — Postgres Row-Level Security is a no-op for
      # superusers and table owners, so the app must use this restricted
      # role for RLS on the alerts table to actually apply.
      DATABASE_URL: postgresql://ushma_app:change_this_password_in_production@db:5432/ushma
      AUTHORITY_PASSCODE: ushma-authority-2026
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:5000/api
    depends_on:
      - backend

volumes:
  ushma_db_data:
